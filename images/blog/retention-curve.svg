<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" role="img" aria-labelledby="t">
  <title id="t">A typical audience retention curve and where viewers drop off</title>
  <rect width="800" height="440" rx="20" fill="#0f1117"/>
  <text x="400" y="46" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#ffffff">A typical retention curve</text>
  <g stroke="#3a4049" stroke-width="2">
    <line x1="80" y1="70" x2="80" y2="350"/>
    <line x1="80" y1="350" x2="720" y2="350"/>
  </g>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9aa0a6">
    <text x="40" y="80">100%</text>
    <text x="40" y="350">0%</text>
    <text x="330" y="380" text-anchor="middle">Video progress</text>
  </g>
  <path d="M80 110 L300 120 L360 180 L430 235 L560 260 L720 300" fill="none" stroke="#ff0000" stroke-width="4"/>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#ff6b6b">
    <text x="205" y="100">Hook: hold the first 30 seconds</text>
    <line x1="120" y1="104" x2="295" y2="110" stroke="#ff6b6b" stroke-width="1.5" stroke-dasharray="3 4"/>
    <text x="600" y="240">Long-tail</text>
    <text x="600" y="256">loyal viewers</text>
  </g>
  <text x="400" y="420" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#9aa0a6">The shape matters more than the peak: steady drops are normal, sharp cliffs signal a broken promise</text>
</svg>
