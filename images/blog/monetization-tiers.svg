<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" role="img" aria-labelledby="t">
  <title id="t">The two YouTube Partner Program eligibility tiers in 2026</title>
  <rect width="800" height="440" rx="20" fill="#0f1117"/>
  <text x="400" y="46" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#ffffff">The two YPP tiers in 2026</text>
  <rect x="50" y="90" width="330" height="270" rx="16" fill="#1d2128" stroke="#ff6b6b" stroke-width="2"/>
  <text x="215" y="126" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#ff6b6b">Early-access tier (fan funding)</text>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#e8eaed">
    <text x="70" y="160">• 500 subscribers</text>
    <text x="70" y="186">• 3 public uploads in 90 days</text>
    <text x="70" y="212">• 3,000 watch hours (12 months) OR</text>
    <text x="70" y="238">• 3M Shorts views (90 days)</text>
    <text x="70" y="270" fill="#9aa0a6">Unlocks: Memberships, Super Thanks,</text>
    <text x="70" y="290" fill="#9aa0a6">Shopping. No ad revenue yet.</text>
  </g>
  <rect x="420" y="90" width="330" height="270" rx="16" fill="#1d2128" stroke="#ff0000" stroke-width="2"/>
  <text x="585" y="126" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#ffffff">Full tier (ad revenue)</text>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#e8eaed">
    <text x="440" y="160">• 1,000 subscribers</text>
    <text x="440" y="186">• 4,000 valid public watch hours</text>
    <text x="440" y="212">  (trailing 12 months) OR</text>
    <text x="440" y="238">• 10M valid Shorts views (90 days)</text>
    <text x="440" y="270" fill="#9aa0a6">Unlocks: everything above plus</text>
    <text x="440" y="290" fill="#9aa0a6">ad revenue on long-form and Shorts.</text>
  </g>
  <text x="400" y="400" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#9aa0a6">All paths also require: no active strikes, 2-Step Verification, an eligible country, and an approved AdSense account</text>
</svg>
