<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" role="img" aria-labelledby="t">
  <title id="t">Upload frequency heatmap by weekday and hour from public upload timestamps</title>
  <rect width="800" height="440" rx="20" fill="#0f1117"/>
  <text x="400" y="44" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#ffffff">Public upload frequency: day x hour</text>
  <text x="400" y="68" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#9aa0a6">Timestamps are public upload data, not viewer behavior</text>
