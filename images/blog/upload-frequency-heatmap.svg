    <text x="86" y="184" text-anchor="end" fill="#9aa0a6">Wed</text>
    <text x="86" y="224" text-anchor="end" fill="#9aa0a6">Thu</text>
    <text x="86" y="264" text-anchor="end" fill="#9aa0a6">Fri</text>
    <text x="86" y="304" text-anchor="end" fill="#9aa0a6">Sat</text>
    <text x="86" y="344" text-anchor="end" fill="#9aa0a6">Sun</text>
  </g>
