<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" role="img" aria-labelledby="t">
  <title id="t">The audio-to-YouTube podcast workflow in 2026</title>
  <rect width="800" height="440" rx="20" fill="#0f1117"/>
  <text x="400" y="46" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#ffffff">Turn an audio podcast into a YouTube growth channel</text>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#e8eaed" text-anchor="middle">
    <rect x="40" y="120" width="140" height="100" rx="12" fill="#1d2128" stroke="#ff0000" stroke-width="2"/>
    <text x="110" y="148" font-weight="700" fill="#ff6b6b">Record</text>
    <text x="110" y="170">Video or audio with</text>
    <text x="110" y="188">clean room tone</text>
    <text x="110" y="206">and chapters in mind</text>

    <rect x="210" y="120" width="140" height="100" rx="12" fill="#1d2128" stroke="#ff0000" stroke-width="2"/>
    <text x="280" y="148" font-weight="700" fill="#ff6b6b">Upload</text>
    <text x="280" y="170">Video file, or use RSS</text>
    <text x="280" y="188">feed import so episodes</text>
    <text x="280" y="206">publish automatically</text>

    <rect x="380" y="120" width="140" height="100" rx="12" fill="#1d2128" stroke="#ff0000" stroke-width="2"/>
    <text x="450" y="148" font-weight="700" fill="#ff6b6b">Package</text>
    <text x="450" y="170">Podcast playlist,</text>
    <text x="450" y="188">chapters, description,</text>
    <text x="450" y="206">and auto-dubbing</text>

    <rect x="550" y="120" width="140" height="100" rx="12" fill="#1d2128" stroke="#ff0000" stroke-width="2"/>
    <text x="620" y="148" font-weight="700" fill="#ff6b6b">Clip</text>
    <text x="620" y="170">Turn highlights into</text>
    <text x="620" y="188">Shorts linked to the</text>
    <text x="620" y="206">full episode</text>
  </g>
  <g stroke="#3a4049" stroke-width="3">
    <line x1="180" y1="170" x2="208" y2="170"/>
    <line x1="350" y1="170" x2="378" y2="170"/>
    <line x1="520" y1="170" x2="548" y2="170"/>
  </g>
  <rect x="150" y="270" width="500" height="80" rx="14" fill="#1d2128"/>
  <text x="400" y="300" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff">Why video wins</text>
  <text x="400" y="326" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#e8eaed">Static-image episodes can lose 90-95% of viewers in the first 90 seconds; on-camera or animated visuals hold the audience</text>
  <text x="400" y="396" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#9aa0a6">Long-form podcasts monetize like any long-form video: ads, memberships, Super Thanks, and Shopping</text>
</svg>
