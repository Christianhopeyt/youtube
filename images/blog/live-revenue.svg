<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" role="img" aria-labelledby="t">
  <title id="t">The four revenue streams available to live streamers in 2026</title>
  <rect width="800" height="440" rx="20" fill="#0f1117"/>
  <text x="400" y="46" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#ffffff">Live stream revenue streams in 2026</text>
  <circle cx="400" cy="230" r="72" fill="#ff0000"/>
  <text x="400" y="224" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff">LIVE</text>
  <text x="400" y="246" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#ffffff">stream</text>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#e8eaed" text-anchor="middle">
    <rect x="40" y="90" width="170" height="90" rx="12" fill="#1d2128" stroke="#ff6b6b" stroke-width="2"/>
    <text x="125" y="116" font-weight="700" fill="#ff6b6b">Super Chat</text>
    <text x="125" y="136">Viewers pay to highlight</text>
    <text x="125" y="154">messages in live chat</text>

    <rect x="590" y="90" width="170" height="90" rx="12" fill="#1d2128" stroke="#ff6b6b" stroke-width="2"/>
    <text x="675" y="116" font-weight="700" fill="#ff6b6b">Memberships</text>
    <text x="675" y="136">Recurring monthly support</text>
    <text x="675" y="154">with perks and badges</text>

    <rect x="40" y="330" width="170" height="90" rx="12" fill="#1d2128" stroke="#ff6b6b" stroke-width="2"/>
    <text x="125" y="356" font-weight="700" fill="#ff6b6b">Ads on live</text>
    <text x="125" y="376">Mid-rolls can run during</text>
    <text x="125" y="394">long live streams</text>

    <rect x="590" y="330" width="170" height="90" rx="12" fill="#1d2128" stroke="#ff6b6b" stroke-width="2"/>
    <text x="675" y="356" font-weight="700" fill="#ff6b6b">Shopping</text>
    <text x="675" y="376">Tag and sell products</text>
    <text x="675" y="394">directly from the stream</text>
  </g>
  <g stroke="#3a4049" stroke-width="3">
    <line x1="210" y1="135" x2="326" y2="205"/>
    <line x1="590" y1="135" x2="474" y2="205"/>
    <line x1="210" y1="375" x2="326" y2="302"/>
    <line x1="590" y1="375" x2="474" y2="302"/>
  </g>
  <text x="400" y="418" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#9aa0a6">Public live-stream watch hours count toward the 4,000-hour YPP threshold</text>
</svg>
