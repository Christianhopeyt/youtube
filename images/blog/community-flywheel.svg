<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" role="img" aria-labelledby="t">
  <title id="t">The community flywheel: engagement feeds monetization</title>
  <rect width="800" height="440" rx="20" fill="#0f1117"/>
  <text x="400" y="46" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#ffffff">The community flywheel</text>
  <circle cx="400" cy="225" r="120" fill="none" stroke="#3a4049" stroke-width="2" stroke-dasharray="6 8"/>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#e8eaed" text-anchor="middle">
    <rect x="330" y="90" width="140" height="52" rx="10" fill="#1d2128" stroke="#ff0000" stroke-width="2"/>
    <text x="400" y="112" font-weight="700" fill="#ff6b6b">Post &amp; upload</text>
    <text x="400" y="130">Consistent format</text>

    <rect x="560" y="199" width="140" height="52" rx="10" fill="#1d2128" stroke="#ff0000" stroke-width="2"/>
    <text x="630" y="221" font-weight="700" fill="#ff6b6b">Engage</text>
    <text x="630" y="239">Comments and polls</text>

    <rect x="330" y="308" width="140" height="52" rx="10" fill="#1d2128" stroke="#ff0000" stroke-width="2"/>
    <text x="400" y="330" font-weight="700" fill="#ff6b6b">Reward</text>
    <text x="400" y="348">Super Thanks, members</text>

    <rect x="100" y="199" width="140" height="52" rx="10" fill="#1d2128" stroke="#ff0000" stroke-width="2"/>
    <text x="170" y="221" font-weight="700" fill="#ff6b6b">Deepen</text>
    <text x="170" y="239">Memberships and series</text>
  </g>
  <g fill="#3a4049">
    <polygon points="360,152 400,170 360,188"/>
    <polygon points="560,266 600,250 600,284"/>
    <polygon points="440,298 400,280 440,262"/>
    <polygon points="240,234 200,250 200,216"/>
  </g>
  <text x="400" y="418" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#9aa0a6">Community posts reach subscribers and non-subscribers, which makes them a discovery channel, not just a newsletter</text>
</svg>
